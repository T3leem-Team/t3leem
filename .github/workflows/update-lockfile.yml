name: Fix dependency security

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-dependency-security
  cancel-in-progress: false

jobs:
  fix-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Remove obsolete package.json overrides
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (pkg.pnpm?.overrides) {
            delete pkg.pnpm.overrides;

            if (Object.keys(pkg.pnpm).length === 0) {
              delete pkg.pnpm;
            }

            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          }
          NODE

      - name: Check workspace overrides
        run: |
          echo "=== pnpm-workspace.yaml ==="
          cat pnpm-workspace.yaml

          echo "=== pnpm version ==="
          pnpm --version

          grep -qE '^overrides:' pnpm-workspace.yaml || {
            echo "ERROR: overrides section is missing."
            exit 1
          }

          grep -qE '^[[:space:]]+ip-address:[[:space:]]*10\.5\.1[[:space:]]*$' pnpm-workspace.yaml || {
            echo "ERROR: ip-address override must be 10.5.1."
            exit 1
          }

      - name: Regenerate lockfile
        run: |
          pnpm install --lockfile-only --force --ignore-scripts --no-frozen-lockfile

      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify dependency versions
        run: |
          pnpm why ip-address
          pnpm why nanoid
          pnpm why zod

      - name: Verify patched versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');

          const checks = [
            {
              name: 'ip-address',
              version: '10.5.1',
              pattern: /ip-address@10\.5\.1(?:\(|:)/,
            },
            {
              name: 'nanoid',
              version: '3.3.18',
              pattern: /nanoid@3\.3\.18(?:\(|:)/,
            },
            {
              name: 'zod',
              version: '4.6.6 or newer',
              pattern: /zod@(?:4\.(?:6\.\d+|[7-9]\.\d+|[1-9]\d+\.\d+)|[5-9]\.\d+\.\d+|[1-9]\d+\.\d+\.\d+)(?:\(|:)/,
            },
          ];

          let failed = false;

          for (const item of checks) {
            const found = item.pattern.test(lock);

            console.log(
              `${item.name} ${item.version}: ${found ? 'FOUND' : 'NOT FOUND'}`
            );

            if (!found) failed = true;
          }

          if (failed) {
            console.error('Required dependency versions were not found in the lockfile.');
            process.exit(1);
          }
          NODE

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Commit dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json pnpm-workspace.yaml pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi

          git commit -m "fix: update vulnerable transitive dependencies"
          git push origin main
