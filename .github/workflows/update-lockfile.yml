name: Fix Zod Security Alert

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-zod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update Zod dependency
        run: |
          pnpm add zod@4.6.7 --save-exact --lockfile-only

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Zod version
        run: |
          pnpm why zod
          node -e "
          const fs = require('fs');
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          if (!lock.includes('zod@4.6.7')) {
            console.error('Expected Zod 4.6.7 not found');
            process.exit(1);
          }
          "

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "fix: update zod security dependency"
          git push origin main
