
name: Fix dependency security

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-dependency-security
  cancel-in-progress: false

jobs:
  fix-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Apply safe dependency overrides
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));

          pkg.pnpm ??= {};
          pkg.pnpm.overrides ??= {};
          pkg.pnpm.overrides['ip-address'] = '10.3.1';
          pkg.pnpm.overrides['nanoid@3'] = '3.3.18';

          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Diagnose pnpm overrides
        run: |
          echo "=== pnpm version ==="
          pnpm --version

          echo "=== package.json overrides ==="
          node -e "console.log(JSON.stringify(require('./package.json').pnpm?.overrides, null, 2))"

          echo "=== pnpm config ==="
          pnpm config get overrides || true

      - name: Diagnose lockfile override behavior
        run: |
          echo "=== Lockfile before ==="
          grep -nE 'ip-address@|nanoid@3\.' pnpm-lock.yaml | head -40 || true

          echo "=== Regenerate lockfile ==="
          pnpm install --lockfile-only --force --ignore-scripts --no-frozen-lockfile

          echo "=== Lockfile after ==="
          grep -nE 'ip-address@|nanoid@3\.' pnpm-lock.yaml | head -40 || true

          echo "=== Lockfile diff ==="
          git diff -- pnpm-lock.yaml

      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify dependency versions
        run: |
          pnpm why ip-address
          pnpm why nanoid
          pnpm why zod

      - name: Verify patched versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');

          const checks = [
            {
              name: 'ip-address',
              version: '10.3.1',
              pattern: /ip-address@10\.3\.1(?:\(|:)/,
            },
            {
              name: 'nanoid',
              version: '3.3.18',
              pattern: /nanoid@3\.3\.18(?:\(|:)/,
            },
          ];

          let failed = false;

          for (const item of checks) {
            const found = item.pattern.test(lock);
            console.log(
              `${item.name} ${item.version}: ${found ? 'FOUND' : 'NOT FOUND'}`
            );

            if (!found) failed = true;
          }

          if (failed) {
            console.error('Lockfile does not contain all expected versions.');
            process.exit(1);
          }
          NODE

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Show pending changes
        if: always()
        run: |
          echo "=== Git status ==="
          git status --short

          echo "=== Dependency diff ==="
          git diff -- package.json pnpm-lock.yaml

      # Intentionally no commit or push during diagnosis.
