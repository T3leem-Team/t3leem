name: Fix Zod Security Alert

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-zod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Override vulnerable Zod
        run: |
          pnpm pkg set 'pnpm.overrides.zod=4.6.7'
          pnpm install --lockfile-only

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Zod version
        run: |
          pnpm why zod
          node <<'NODE'
          const fs = require('fs');
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');

          if (/zod@3\.\d/.test(lock)) {
            console.error('Vulnerable Zod 3 dependency remains in lockfile.');
            process.exit(1);
          }

          if (!lock.includes('zod@4.6.7')) {
            console.error('Zod 4.6.7 was not found in lockfile.');
            process.exit(1);
          }

          console.log('Zod lockfile verification passed.');
          NODE

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-anon-key"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "test-publishable-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "fix: override vulnerable zod dependency"
          git push origin main
