
name: Fix dependency security

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-dependency-security
  cancel-in-progress: false

jobs:
  fix-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Check workspace overrides
        run: |
          echo "=== pnpm-workspace.yaml ==="
          cat pnpm-workspace.yaml

          echo "=== pnpm version ==="
          pnpm --version

          grep -qE '^overrides:' pnpm-workspace.yaml || {
            echo "ERROR: overrides section is missing."
            exit 1
          }

          grep -qE '^[[:space:]]+ip-address:[[:space:]]*10\.7\.4[[:space:]]*$' pnpm-workspace.yaml || {
            echo "ERROR: ip-address override must be 10.7.4."
            exit 1
          }

          grep -qE '^[[:space:]]+uuid:[[:space:]]*\^?11\.1\.1' pnpm-workspace.yaml || {
            echo "ERROR: uuid override to 11.1.1 or newer is missing."
            exit 1
          }

      - name: Verify ExcelJS dependency
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          if (!pkg.dependencies?.exceljs) {
            console.error('ERROR: exceljs is missing from package.json dependencies.');
            process.exit(1);
          }

          const sections = [
            'dependencies',
            'devDependencies',
            'optionalDependencies',
            'peerDependencies',
          ];

          const hasXlsx = sections.some(
            (section) => Boolean(pkg[section]?.xlsx)
          );

          if (hasXlsx) {
            console.error('ERROR: Old xlsx dependency must be removed.');
            process.exit(1);
          }

          console.log(`ExcelJS requested version: ${pkg.dependencies.exceljs}`);
          console.log('Old xlsx dependency: removed');
          NODE

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --force --ignore-scripts --no-frozen-lockfile

      - name: Verify old xlsx removal
        run: |
          if grep -nE '^[[:space:]]*xlsx(@[^:]+)?:' pnpm-lock.yaml; then
            echo "ERROR: Old xlsx package still exists in pnpm-lock.yaml."
            exit 1
          fi

          echo "Verified: old xlsx package is absent from pnpm-lock.yaml."

      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify dependency versions
        run: |
          pnpm why exceljs
          pnpm why uuid
          pnpm why ip-address
          pnpm why nanoid
          pnpm why zod

      - name: Verify lockfile versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');

          const checks = [
            {
              name: 'exceljs',
              pattern: /exceljs@[^:\s(]+(?:\(|:)/,
            },
            {
              name: 'uuid 11.1.1 or newer',
              pattern: /uuid@(?:11\.(?:[1-9]\d*|[1-9]\d*\.\d+)|1[2-9]\.\d+\.\d+|[2-9]\d*\.\d+\.\d+)(?:\(|:)/,
            },
            {
              name: 'ip-address 10.7.4',
              pattern: /ip-address@10\.7\.4(?:\(|:)/,
            },
            {
              name: 'nanoid 3.3.18',
              pattern: /nanoid@3\.3\.18(?:\(|:)/,
            },
            {
              name: 'zod 4.6.6 or newer',
              pattern: /zod@(?:4\.(?:6\.\d+|[7-9]\.\d+|[1-9]\d+\.\d+)|[5-9]\.\d+\.\d+|[1-9]\d*\.\d+\.\d+)(?:\(|:)/,
            },
          ];

          let failed = false;

          for (const item of checks) {
            const found = item.pattern.test(lock);
            console.log(`${item.name}: ${found ? 'FOUND' : 'NOT FOUND'}`);
            if (!found) failed = true;
          }

          if (failed) {
            console.error('Required dependency versions were not found in the lockfile.');
            process.exit(1);
          }
          NODE

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "security: remove vulnerable xlsx dependency"
          git push origin main
