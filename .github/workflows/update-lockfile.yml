
name: Check ExcelJS Security

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-exceljs-security
  cancel-in-progress: false

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check latest ExcelJS
        run: |
          echo "=========================================="
          echo "LATEST EXCELJS VERSION"
          echo "=========================================="
          pnpm view exceljs version

          echo ""
          echo "=========================================="
          echo "CURRENT EXCELJS DEPENDENCIES"
          echo "=========================================="
          pnpm view exceljs@4.4.0 dependencies

          echo ""
          echo "=========================================="
          echo "LATEST EXCELJS DEPENDENCIES"
          echo "=========================================="
          pnpm view exceljs@latest dependencies

      - name: Check latest archiver
        run: |
          echo "=========================================="
          echo "LATEST ARCHIVER VERSION"
          echo "=========================================="
          pnpm view archiver version

          echo ""
          echo "=========================================="
          echo "ARCHIVER DEPENDENCIES"
          echo "=========================================="
          pnpm view archiver@latest dependencies

      - name: Inspect current dependency trees
        run: |
          echo "=========================================="
          echo "MINIMATCH"
          echo "=========================================="
          pnpm why minimatch

          echo ""
          echo "=========================================="
          echo "EXCELJS"
          echo "=========================================="
          pnpm why exceljs
