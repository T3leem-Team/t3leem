name: Check Minimatch Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check dependency requirements
        run: |
          echo "===== GLOB 7 ====="
          pnpm view glob@7.2.3 dependencies

          echo ""
          echo "===== READDIR-GLOB 1 ====="
          pnpm view readdir-glob@1.1.3 dependencies

          echo ""
          echo "===== MINIMATCH 11.0.1 ====="
          pnpm view minimatch@11.0.1 engines

          echo ""
          echo "===== MINIMATCH 11 API ====="
          pnpm view minimatch@11.0.1 exports
